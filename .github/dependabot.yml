version: 2
updates:
  # Maven dependencies: a single entry for the root aggregator, which Dependabot
  # traverses into every pom listed in <modules>. The shared version properties
  # (quarkus.platform.version, jackson.version, ...) live in the root pom, so a
  # per-service entry made Dependabot open one duplicate PR per module for the
  # very same one-line change.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Docker base images — one entry per service's Dockerfile set
  - package-ecosystem: "docker"
    directory: "/authentication-service/src/main/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "authentication-service"

  - package-ecosystem: "docker"
    directory: "/product-service/src/main/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "product-service"

  - package-ecosystem: "docker"
    directory: "/order-service/src/main/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "order-service"

  - package-ecosystem: "docker"
    directory: "/notification-service/src/main/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "notification-service"

  # docker-compose.yml image pins at the repo root. The "docker" ecosystem only
  # parses Dockerfiles and Kubernetes manifests, so it aborted every run with
  # "No Dockerfiles nor Kubernetes YAML found in /" and never tracked a single
  # compose image. Compose files need their own ecosystem.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # GitHub Actions workflow versions (workflows land as part of Epic 2 — CI/CD Pipeline)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
