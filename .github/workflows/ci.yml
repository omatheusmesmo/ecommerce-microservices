name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-modules:
    uses: ./.github/workflows/detect-modules.yml

  test:
    name: Build & test (${{ matrix.service }})
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build & test
        working-directory: ${{ matrix.service }}
        run: mvn -B clean test
