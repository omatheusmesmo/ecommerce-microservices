name: Build & Push Container Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-modules:
    uses: ./.github/workflows/detect-modules.yml

  build-jvm:
    name: Build & push (${{ matrix.service }}, jvm)
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Package (fast-jar)
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -Dquarkus.package.type=fast-jar -DskipTests -ntp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}-jvm
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest-jvm

  build-native:
    name: Build & push (${{ matrix.service }}, native)
    needs: detect-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build native executable (container build)
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -Dnative -Dquarkus.native.container-build=true -DskipTests -ntp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.native-micro
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}-native
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest-native
