name: Perform Release

run-name: Perform ${{ github.event.inputs.tag || github.ref_name }} Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 1.2.0)'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-modules:
    uses: ./.github/workflows/detect-modules.yml

  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate changelog from merged PRs
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ "${PREVIOUS_TAG}" = "${{ steps.version.outputs.tag }}" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi

          SINCE_DATE=$(git log -1 --format=%aI "${PREVIOUS_TAG}" 2>/dev/null || echo "2000-01-01T00:00:00Z")

          CHANGELOG=""
          PAGE=1
          while true; do
            RESPONSE=$(gh api "repos/${{ github.repository }}/pulls" \
              --method GET \
              -f state=closed \
              -f sort=updated \
              -f direction=desc \
              -f per_page=100 \
              -f page=${PAGE} \
              --jq '.[] | select(.merged_at != null and (.merged_at > "'${SINCE_DATE}'")) | "- \(.title) (#\(.number)) @\(.user.login)"')
            if [ -z "${RESPONSE}" ]; then
              break
            fi
            CHANGELOG="${CHANGELOG}${RESPONSE}"$'\n'
            PAGE=$((PAGE + 1))
          done

          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- Initial release"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release-jvm:
    name: Release JVM image (${{ matrix.service }})
    needs: [detect-modules, metadata]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Package (fast-jar)
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -Dquarkus.package.type=fast-jar -DskipTests -ntp

      - name: Upload service artifact
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-microservices-${{ needs.metadata.outputs.version }}-${{ matrix.service }}
          path: ${{ matrix.service }}/target/quarkus-app/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.jvm
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ needs.metadata.outputs.version }}-jvm

  release-native:
    name: Release native image (${{ matrix.service }})
    needs: [detect-modules, metadata]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build native executable (container build)
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -Dnative -Dquarkus.native.container-build=true -DskipTests -ntp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.native-micro
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ needs.metadata.outputs.version }}-native

  create-release:
    name: Create GitHub Release
    needs: [metadata, release-jvm, release-native]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Release ${{ needs.metadata.outputs.tag }}
          body: |
            ## What's Changed

            ${{ needs.metadata.outputs.changelog }}

            ## Artifacts

            - **JVM**: download the `ecommerce-microservices-${{ needs.metadata.outputs.version }}-<service>` artifact for the service you need, runs with `java -jar quarkus-run.jar`
            - **Docker**: `docker pull ghcr.io/${{ github.repository_owner }}/<service>:${{ needs.metadata.outputs.version }}-jvm` (or `-native`), or build from source with `docker compose up --build`

            > _Draft release - edit and publish when ready._
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
