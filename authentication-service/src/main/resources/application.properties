# ========================================
# DATABASE CONFIGURATION
# ========================================

# Database Kind
quarkus.datasource.db-kind=postgresql

# Dev: DevServices (auto DB)
quarkus.datasource.devservices.enabled=true

# Prod: External DB via env vars
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Fail fast on a stalled pool/DB instead of blocking request threads indefinitely
quarkus.datasource.jdbc.acquisition-timeout=3S
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=10
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=10
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=15

# ========================================
# HIBERNATE ORM CONFIGURATION
# ========================================

# Naming Strategy (camelCase -> snake_case)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Hibernate should NOT create tables when using Flyway
quarkus.hibernate-orm.database.generation=validate

# Dev: Show SQL for debugging
%dev.quarkus.hibernate-orm.log.sql=true

# ========================================
# FLYWAY CONFIGURATION
# ========================================

# Migrate at start
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# ========================================
# QUARTZ CONFIGURATION
# ========================================

# Persistent, clustered job store (Postgres via the default datasource) so scheduled
# jobs such as RefreshTokenCleanupService run once per cluster instead of once per
# replica. Without this, Quartz defaults to an in-memory RAMJobStore per instance.
# Schema: db/migration/V4__CREATE_QUARTZ_TABLES.sql.
quarkus.quartz.clustered=true
quarkus.quartz.store-type=jdbc-cmt

# ========================================
# JWT CONFIGURATION (SmallRye JWT)
# ========================================


# --- SmallRye JWT Configuration ---

# Signature algorithm (to generate tokens) - switched to ES256 (ECC)
smallrye.jwt.new-token.signature-algorithm=ES256

# Verification algorithm (to validate incoming tokens)
mp.jwt.verify.publickey.algorithm=ES256

# --- Key Locations ---
# The trick here is to add the 'file:' prefix before the variable
# This forces Quarkus to look at the file system.

# Private key location (to sign/create tokens)
smallrye.jwt.sign.key.location=file:${JWT_KEY_LOCATION}

# Public key location (to encrypt or verify tokens)
smallrye.jwt.encrypt.key.location=file:${JWT_PUBLIC_KEY_LOCATION}

# Optional: Public key location for default validation (mp-jwt)
mp.jwt.verify.publickey.location=file:${JWT_PUBLIC_KEY_LOCATION}

# Configure the token issuer
mp.jwt.verify.issuer=authentication-service

# Test only: fixed keypair (src/test/resources) so the test suite doesn't require
# JWT_KEY_LOCATION/JWT_PUBLIC_KEY_LOCATION to be set. Never applies to %dev or %prod -
# %dev still needs a real keypair on disk (see .env.example / docker-compose.yml).
%test.smallrye.jwt.sign.key.location=testPrivateKey.pem
%test.smallrye.jwt.encrypt.key.location=testPublicKey.pem
%test.mp.jwt.verify.publickey.location=testPublicKey.pem

# ========================================
# LOGGING CONFIGURATION
# ========================================

# Default level
quarkus.log.level=INFO
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.log.category."com.ecommerce.*".level=DEBUG

# HTTP access log: per-request audit trail with response time (TTR, %D in millis),
# separate from the business-level LOG calls already in the resources/services.
quarkus.http.record-request-start-time=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D ms

# ========================================
# CORS
# ========================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H

# ========================================
# METRICS (Micrometer / Prometheus)
# ========================================
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ========================================
# APPLICATION SPECIFIC
# ========================================

# Encryption key for CryptoUtil (AES-256-GCM, must be a 32-byte string).
# No default here on purpose: prod must fail fast at startup if ENCRYPTION_KEY is missing.
app.encryption.key=${ENCRYPTION_KEY}

# Dev/test only: fixed key so local runs and tests don't require ENCRYPTION_KEY to be set.
# Never applies to %prod.
%dev.app.encryption.key=${ENCRYPTION_KEY:dev-encryption-key-not-for-prod-}
%test.app.encryption.key=${ENCRYPTION_KEY:test-encryption-key-not-for-prod}

# Frontend base URL for email links
app.frontend.base-url=${FRONTEND_BASE_URL:ecommerce.omatheusmesmo.dev}

# Token expirations
app.token.activation.expiry.hours=24
app.token.reset.expiry.minutes=15

# Concurrency cap for the CPU/memory-heavy Argon2 hashing (see Argon2Executor);
# tunable per deployment against the container memory budget
com.ecommerce.service.Argon2Executor/execute/Bulkhead/value=${AUTH_ARGON2_BULKHEAD:4}

# ========================================
# KAFKA CONFIGURATION
# ========================================

# Enable DevServices for Kafka in dev
%dev.quarkus.kafka.devservices.enabled=true
# Disable DevServices for Kafka in prod
%prod.quarkus.kafka.devservices.enabled=false

# Kafka broker (only in prod, dev uses DevServices)
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Producer - Authentication Email Events
mp.messaging.outgoing.authentication-email.connector=smallrye-kafka
mp.messaging.outgoing.authentication-email.topic=authentication-email
mp.messaging.outgoing.authentication-email.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.authentication-email.acks=1

# ========================================
# OPENTELEMETRY (Tracing)
# ========================================
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://jaeger:4318/v1/traces
quarkus.otel.service.name=authentication-service
quarkus.otel.service.version=1.0.0
