# ========================================
# ORDER SERVICE CONFIGURATION
# ========================================
quarkus.http.port=8080
%dev.quarkus.http.port=8081

# ========================================
# SECURITY
# ========================================
%prod.mp.jwt.verify.publickey.location=file:${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.publickey.algorithm=ES256
mp.jwt.verify.issuer=authentication-service

%test.quarkus.smallrye-jwt.enabled=false

# ========================================
# DATABASE - POSTGRESQL
# ========================================
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/orderdb}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:admin}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:admin123}

# Connection pool
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# Fail fast on a stalled pool/DB instead of blocking request threads indefinitely
quarkus.datasource.jdbc.acquisition-timeout=3S
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=10
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=10
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=15

# ========================================
# HIBERNATE ORM
# ========================================
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Dev - Validate schema only (Flyway manages migrations)
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.log.sql=true

# Test - Drop and recreate (in-memory database)
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Production - Validate only (Flyway already applied)
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.log.sql=false

# ========================================
# FLYWAY (Database Migrations)
# ========================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# ========================================
# IDEMPOTENCY (Idempotency-Key header)
# ========================================
quarkus.idempotency.store=jdbc
quarkus.idempotency.jdbc.table=idempotency_entry
quarkus.idempotency.require-key=false
quarkus.idempotency.lock-ttl=30S
quarkus.idempotency.response-ttl=24H
quarkus.idempotency.cache-error-responses=false
quarkus.idempotency.captured-headers=Location

# ========================================
# KAFKA
# ========================================
# Dev Services will automatically start a Kafka broker in dev/test mode
# No configuration needed for development

# Production: Use external Kafka cluster
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

# ========================================
# OUTBOX PATTERN - IMPORTANT
# ========================================
# This service uses the Transactional Outbox Pattern. Events are persisted in the
# 'outbox' table within the same transaction as business data. In %prod, a Debezium
# Connector (running on Kafka Connect) captures changes via CDC and publishes them to
# Kafka topics - OrderService never publishes directly. Outside %prod, where nothing
# runs that connector, OutboxDevPublisher polls the table and publishes the same way
# Debezium would, so the outbox flow works in a plain dev loop or in tests.

mp.messaging.outgoing.outbox-order-events.connector=smallrye-kafka
mp.messaging.outgoing.outbox-order-events.topic=outbox.event.Order
mp.messaging.outgoing.outbox-order-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox-order-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ========================================
# OBSERVABILITY
# ========================================
# Health Check
quarkus.smallrye-health.root-path=/q/health

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ========================================
# LOGGING
# ========================================
quarkus.log.level=INFO
%dev.quarkus.log.category."com.ecommerce.*".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# HTTP access log: per-request audit trail with response time (TTR, %D in millis),
# separate from the business-level LOG calls already in the resources/services.
quarkus.http.record-request-start-time=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D ms

# JSON logs (disabled by default, enabled in production)
quarkus.log.console.json.enabled=false

# ========================================
# PROFILE: PRODUCTION
# ========================================
%prod.quarkus.log.console.json.enabled=true

# ========================================
# OPENTELEMETRY (Tracing)
# ========================================
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://jaeger:4318/v1/traces
quarkus.otel.service.name=order-service
quarkus.otel.resource.attributes=service.version=1.0.0

# ========================================
# OUTBOX PATTERN
# ========================================
# The outbox table is used for the Transactional Outbox Pattern.
# Events are persisted in the 'outbox' table within the same transaction as business data.
# A separate Debezium PostgreSQL Connector (running on Kafka Connect) captures changes
# from this table via CDC (Change Data Capture) and publishes them to Kafka topics
# using the Debezium Outbox Event Router SMT (Single Message Transformation).
#
# The outbox table schema follows Debezium conventions:
# - id: BIGINT (event unique identifier)
# - aggregate_type: VARCHAR (entity type, e.g., "Order")
# - aggregate_id: VARCHAR (entity ID, used as Kafka message key)
# - event_type: VARCHAR (event type, e.g., "OrderCreated", "OrderStatusChanged")
# - payload: TEXT (JSON serialized event data)
# - created_at: TIMESTAMP (event creation timestamp)
#
# See Debezium Outbox Event Router documentation:
# https://debezium.io/documentation/reference/transformations/outbox-event-router.html

# ========================================
# SAGA TIMEOUTS
# ========================================
# A step whose reply is lost would otherwise leave the SAGA waiting forever. Every
# non-terminal step gets a deadline; SagaTimeoutJob sweeps the ones past it, re-sends the
# command, and gives up once the attempts are spent. Re-sending is safe because the stock
# commands are keyed by order id and replay their recorded outcome.
order.saga.reply-timeout=30s
order.saga.max-attempts=3
order.saga.sweep-interval=30s

# ========================================
# TEST CONSUMER (Dev Only)
# ========================================
# This consumer is for testing purposes only. It simulates what a downstream
# service (like notification-service) would do when consuming events from Kafka.
# In production, this consumer would be in a separate microservice.

# Consumer - Order Events (simulates Debezium output topic)
mp.messaging.incoming.order-events-consumer.connector=smallrye-kafka
mp.messaging.incoming.order-events-consumer.topic=outbox.event.Order
mp.messaging.incoming.order-events-consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-consumer.group.id=order-service-test-consumer
mp.messaging.incoming.order-events-consumer.auto.offset.reset=earliest
mp.messaging.incoming.order-events-consumer.enable.auto.commit=true

# Consumer - SAGA stock replies from product-service
mp.messaging.incoming.stock-replies.connector=smallrye-kafka
mp.messaging.incoming.stock-replies.topic=product.stock.replies
mp.messaging.incoming.stock-replies.group.id=order-service
mp.messaging.incoming.stock-replies.auto.offset.reset=earliest
mp.messaging.incoming.stock-replies.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.stock-replies.failure-strategy=dead-letter-queue
mp.messaging.incoming.stock-replies.dead-letter-queue.topic=product.stock.replies.order-service.dlq
mp.messaging.incoming.stock-replies.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.stock-replies.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer
