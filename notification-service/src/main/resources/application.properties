# ========================================
# NOTIFICATION SERVICE CONFIGURATION
# ========================================
quarkus.http.port=8080

# ========================================
# DISCORD WEBHOOK
# ========================================
discord.webhook.url=${DISCORD_WEBHOOK_URL: }
discord.webhook.enabled=${DISCORD_WEBHOOK_ENABLED:true}
notification.discord.enabled=${NOTIFICATION_DISCORD_ENABLED:true}

# ========================================
# BREVO (SENDINBLUE) EMAIL
# ========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3
brevo.sender.name=${BREVO_SENDER_NAME:BestEcommerce}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@example.com}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}

# ========================================
# KAFKA
# ========================================
# Dev Services will automatically start a Kafka broker in dev/test mode
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

# ========================================
# KAFKA CONSUMERS - ORDER SERVICE
# ========================================
# Consumes events from Debezium Outbox Pattern (outbox.event.Order topic)
# The payload contains OrderCreatedEvent or OrderStatusChangedEvent JSON
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=outbox.event.Order
mp.messaging.incoming.order-events.group.id=notification-service
mp.messaging.incoming.order-events.auto.offset.reset=earliest
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Dead Letter Queue (DLQ) Configuration
# enable.auto.commit is deliberately NOT set: with it on, the Kafka client commits offsets
# on its own timer regardless of processing outcome, so a failed message's offset still
# commits and failure-strategy=dead-letter-queue never gets a chance to run. Leaving it off
# lets Reactive Messaging commit only after a message is acked (or routed to the DLQ below).
#
# There is no per-message retry-with-backoff in this connector version - "retry"/"retry-attempts"
# only govern broker reconnection, not message redelivery - so a failure goes straight to the DLQ.
mp.messaging.incoming.order-events.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events.dead-letter-queue.topic=outbox.event.Order.dlq
mp.messaging.incoming.order-events.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.order-events.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# DLQ Consumer Configuration
# Consumes messages from the Dead Letter Queue for logging/monitoring
mp.messaging.incoming.order-events-dlq.connector=smallrye-kafka
mp.messaging.incoming.order-events-dlq.topic=outbox.event.Order.dlq
mp.messaging.incoming.order-events-dlq.group.id=notification-service-dlq
mp.messaging.incoming.order-events-dlq.auto.offset.reset=earliest
mp.messaging.incoming.order-events-dlq.enable.auto.commit=true
mp.messaging.incoming.order-events-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ========================================
# KAFKA CONSUMERS - PRODUCT SERVICE
# ========================================
mp.messaging.incoming.product-created.connector=smallrye-kafka
mp.messaging.incoming.product-created.topic=product-created
mp.messaging.incoming.product-created.group.id=notification-service
mp.messaging.incoming.product-created.auto.offset.reset=earliest
mp.messaging.incoming.product-created.enable.auto.commit=true
mp.messaging.incoming.product-created.failure-strategy=ignore

mp.messaging.incoming.stock-changed.connector=smallrye-kafka
mp.messaging.incoming.stock-changed.topic=stock-changed
mp.messaging.incoming.stock-changed.group.id=notification-service
mp.messaging.incoming.stock-changed.auto.offset.reset=earliest
mp.messaging.incoming.stock-changed.enable.auto.commit=true
mp.messaging.incoming.stock-changed.failure-strategy=ignore

# ========================================
# KAFKA CONSUMERS - AUTHENTICATION SERVICE
# ========================================
# Consumes TokenUrlEvent (account activation / password reset links) and
# TokenConfirmationEvent (activation / reset confirmations) from authentication-service
mp.messaging.incoming.authentication-email.connector=smallrye-kafka
mp.messaging.incoming.authentication-email.topic=authentication-email
mp.messaging.incoming.authentication-email.group.id=notification-service
mp.messaging.incoming.authentication-email.auto.offset.reset=earliest
mp.messaging.incoming.authentication-email.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Dead Letter Queue (DLQ) Configuration
mp.messaging.incoming.authentication-email.failure-strategy=dead-letter-queue
mp.messaging.incoming.authentication-email.dead-letter-queue.topic=authentication-email.dlq
mp.messaging.incoming.authentication-email.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.authentication-email.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# DLQ Consumer Configuration
mp.messaging.incoming.authentication-email-dlq.connector=smallrye-kafka
mp.messaging.incoming.authentication-email-dlq.topic=authentication-email.dlq
mp.messaging.incoming.authentication-email-dlq.group.id=notification-service-dlq
mp.messaging.incoming.authentication-email-dlq.auto.offset.reset=earliest
mp.messaging.incoming.authentication-email-dlq.enable.auto.commit=true
mp.messaging.incoming.authentication-email-dlq.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ========================================
# OBSERVABILITY
# ========================================
# Health Check
quarkus.smallrye-health.root-path=/q/health

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ========================================
# LOGGING
# ========================================
quarkus.log.level=INFO
%dev.quarkus.log.category."com.ecommerce.*".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# JSON logs (disabled by default, enabled in production)
quarkus.log.console.json.enabled=false

# HTTP access log: per-request audit trail with response time (TTR, %D in millis),
# separate from the business-level LOG calls already in the resources/services.
quarkus.http.record-request-start-time=true
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D ms

# ========================================
# PROFILE:  DEV
# ========================================
%dev.quarkus.console.enabled=false
%dev.quarkus.log.console.json.enabled=false

# ========================================
# PROFILE: PRODUCTION
# ========================================
%prod.quarkus.log.console.json.enabled=true
